<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">这一步留下的问题</p><p class="figsub">持续披露与反欺诈之外的三个新问题。点选一个，看它通向哪一章。</p></div></div>
    <div class="s2nx" id="s2nx"></div>
    <p class="s2nx-m" id="s2nx-m" aria-live="polite"></p>
  </div>
</figure>
<style>
.s2nx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s2nx button{font:inherit;text-align:left;cursor:pointer;border:1px solid transparent;background:var(--quote);color:var(--ink);border-radius:10px;padding:12px}
.s2nx button b{display:block;font-size:14px}.s2nx button em{font-style:normal;font-size:12px;color:var(--faint)}
.s2nx button.on{border-color:var(--accent)}
.s2nx-m{font-size:14px;margin:12px 0 0;min-height:2.6em}
@media (max-width:640px){.s2nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['什么算证券','→ 第 3 章','定期报告与规则 10b-5 都以「证券」为前提；把产品设计成不叫股票、也不叫债券的样子，能否绕开。'],
    ['中间人说的话','→ 第 4 章','经纪商向客户推荐证券时有自己的利益；规则 10b-5 只管假话，不管推荐是否适合客户。'],
    ['内部人与操纵','→ 第 7 章','规则 10b-5 后来成为追究内幕交易与操纵的主要依据；价格被有意扭曲，需要更具体的规则。']];
  const g=document.getElementById('s2nx'),m=document.getElementById('s2nx-m');
  g.innerHTML=Q.map(q=>`<button type="button"><b>${q[0]}</b><em>${q[1]}</em></button>`).join('');
  const bs=[...g.children];const set=i=>{bs.forEach((b,j)=>b.classList.toggle('on',i===j));m.textContent=Q[i][2];};
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));set(0);
})();
</script>
