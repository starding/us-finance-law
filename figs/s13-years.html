<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">2022–2026 年：披露清单的加长与收缩</p><p class="figsub">按截至 2026 年 11 月的法律状态筛选；点选一行，看它经历的每一步。</p></div></div>
    <div class="k13y-f" id="k13y-f"></div>
    <div class="k13y" id="k13y"></div>
    <div class="k13y-ax" id="k13y-ax"></div>
    <div class="k13y-d" id="k13y-d" aria-live="polite"></div>
  </div>
</figure>
<style>
.k13y-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.k13y-f button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.k13y-f button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.k13y-r{display:grid;grid-template-columns:150px 1fr;align-items:center;min-height:34px;border-top:1px solid var(--line);cursor:pointer;transition:opacity .25s}
.k13y-r.dim{opacity:.18}
.k13y-r.on{background:var(--quote)}
.k13y-r span{font-size:13px;padding:4px 8px 4px 2px;line-height:1.3}
.k13y-r span i{display:block;font-style:normal;font-size:11px;color:var(--faint)}
.k13y-tr{position:relative;height:34px}
.k13y-tr em{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.k13y-tr em.a{background:var(--accent);border-color:var(--accent)}
.k13y-tr em.p{border-style:dashed;border-color:var(--accent)}
.k13y-tr s{position:absolute;top:50%;height:2px;background:var(--line);text-decoration:none}
.k13y-ax{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line)}
.k13y-ax div{position:relative;height:20px}
.k13y-ax b{position:absolute;font-size:11px;font-weight:400;color:var(--faint);transform:translateX(-50%);top:3px}
.k13y-d{margin-top:12px;background:var(--quote);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6;min-height:7em}
.k13y-d ol{margin:6px 0 0;padding-left:1.3em}
.k13y-lg{font-size:12px;color:var(--muted);margin:8px 0 0}
@media (max-width:560px){.k13y-r,.k13y-ax{grid-template-columns:96px 1fr}.k13y-r span{font-size:12px}}
</style>
<script>
(function(){
  const Y0=2022,Y1=2027;
  const x=d=>{const [y,m]=d.split('-').map(Number);return ((y-Y0)+(m-0.5)/12)/(Y1-Y0)*100;};
  // 事件类型：a 通过或生效，p 提案，n 其他（暂缓、诉讼、工作人员行动）
  const R=[
    ['追回规则 10D-1','有效','k',[['2022-10','a','2022 年 10 月 26 日 SEC 通过规则 10D-1'],['2023-06','n','2023 年 6 月 9 日 SEC 批准纽交所与纳斯达克的上市标准'],['2023-10','a','2023 年 10 月 2 日上市标准生效；12 月 1 日前须制定追回政策'],['2026-11','p','2026 年 11 月 13 日薪酬披露改革提案：保留法定项目、简化披露']]],
    ['13D/13G 期限缩短','有效','k',[['2023-10','a','2023 年 10 月 10 日通过：13D 首次申报 5 个工作日，修订 2 个工作日'],['2024-09','a','2024 年 9 月 30 日 13G 新期限适用；12 月 18 日起须用结构化数据'],['2025-02','n','2025 年 2 月 11 日工作人员解释：施压要求治理措施可能失去 13G 资格']]],
    ['网络安全披露','有效','k',[['2023-07','a','2023 年 7 月 26 日通过 8-K 第 1.05 项与 S-K 第 106 项'],['2023-12','a','2023 年 12 月 18 日起适用 8-K 要求（小型报告公司晚 180 天）'],['2025-05','n','2025 年 5 月五个金融业协会请愿废除第 1.05 项；截至 2026 年 11 月未见规则提案']]],
    ['气候披露','暂缓','z',[['2024-03','a','2024 年 3 月 6 日以 3 比 2 通过'],['2024-04','n','2024 年 4 月 4 日 SEC 自行暂缓实施'],['2025-03','n','2025 年 3 月 27 日 SEC 投票不再辩护'],['2025-09','n','2025 年 9 月 12 日第八巡回法院搁置案件，待 SEC 重新考虑或恢复辩护'],['2026-05','p','2026 年 5 月 29 日提议全部撤销；意见期至 8 月 3 日，尚未最终通过']]],
    ['股东提案规则 14a-8','有效，提议废除','t',[['2025-02','n','2025 年 2 月 12 日 14M 公告撤回 14L'],['2025-11','n','2025 年 11 月 17 日工作人员基本不再回应排除请求'],['2026-08','n','2026 年 8 月 14 日完全停止回应'],['2026-09','p','2026 年 9 月 16 日提议废除；意见截至 11 月 20 日']]],
    ['可选半年报','提案','t',[['2026-05','p','2026 年 5 月 5 日提议以 10-S 半年报代替第一、第三季度 10-Q；尚未通过']]],
    ['申报人类别简化','提案','t',[['2026-05','p','2026 年 5 月 19 日提议简化为两类，大型加速申报人门槛由 7 亿美元提高到 20 亿美元；尚未通过']]],
    ['高管薪酬披露改革','提案','t',[['2026-01','n','2026 年 1 月 13 日主席指示全面复审 S-K 条例'],['2026-11','p','2026 年 11 月 13 日提议改写 S-K 第 402 项；尚未通过']]]
  ];
  const F=[['全部',''],['有效','k'],['已通过但暂缓','z'],['提案中（含提议废除）','t']];
  const f=document.getElementById('k13y-f'),g=document.getElementById('k13y'),ax=document.getElementById('k13y-ax'),d=document.getElementById('k13y-d');
  f.innerHTML=F.map(a=>`<button type="button">${a[0]}</button>`).join('');
  g.innerHTML=R.map((r,i)=>{const ev=r[3];const a=x(ev[0][0]),b=x(ev[ev.length-1][0]);
    return `<div class="k13y-r" data-i="${i}"><span>${r[0]}<i>${r[1]}</i></span><div class="k13y-tr"><s style="left:${a}%;width:${b-a}%"></s>${ev.map(e=>`<em class="${e[1]}" style="left:${x(e[0])}%"></em>`).join('')}</div></div>`;}).join('');
  let h='<div></div><div>';for(let y=Y0;y<=2026;y++)h+=`<b style="left:${(y-Y0+0.5)/(Y1-Y0)*100}%">${y}</b>`;ax.innerHTML=h+'</div>';
  const rows=[...g.children];
  function pick(i){rows.forEach((r,j)=>r.classList.toggle('on',i===j));const r=R[i];
    d.innerHTML=`<strong>${r[0]}</strong>（截至 2026 年 11 月：${r[1]}）<ol>${r[3].map(e=>`<li>${e[2]}</li>`).join('')}</ol><p class="k13y-lg">实心点：通过或生效；虚线圈：提案；空心点：暂缓、诉讼与工作人员行动。</p>`;}
  function filt(k){[...f.children].forEach((b,j)=>b.classList.toggle('on',F[j][1]===k));rows.forEach((r,j)=>r.classList.toggle('dim',!!k&&R[j][2]!==k));}
  rows.forEach((r,i)=>r.addEventListener('click',()=>pick(i)));
  [...f.children].forEach((b,j)=>b.addEventListener('click',()=>filt(F[j][1])));
  filt('');pick(3);
})();
</script>
