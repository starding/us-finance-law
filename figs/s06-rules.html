<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">市场结构规则的进展</p><p class="figsub">2005 年以来的主要规则与提案，截至 2026 年 11 月。点选一项，看它的状态。</p></div></div>
    <div class="l6" id="l6"></div>
    <div class="l6-d"><p class="l6-h" id="l6-h"></p><p id="l6-x"></p></div>
  </div>
</figure>
<style>
.l6{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.l6 button{font:inherit;font-size:13px;cursor:pointer;border:1px solid transparent;background:var(--quote);color:var(--ink);border-radius:9px;padding:8px 10px;display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;text-align:left}
.l6 button.on{border-color:var(--accent)}
.l6 button time{color:var(--muted);font-size:12.5px}
.l6 button span.l6-s{font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.l6-s.l6-ok{background:var(--accent-soft);color:var(--accent)}
.l6-s.l6-wait{border:1px dashed var(--accent);color:var(--accent)}
.l6-s.l6-no{background:var(--line);color:var(--muted)}
.l6-d{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6}
.l6-h{font-weight:600;margin:0 0 4px}.l6-d p{margin:0}
@media (max-width:640px){.l6 button{grid-template-columns:1fr auto}.l6 button time{grid-column:1/3}}
</style>
<script>
(function(){
  const E=[['2005-06-09','全国市场体系条例','l6-ok','生效','规则 610、611、612 把分散的场所连成全国市场；规则 605、606 由原规则 11Ac1-5、11Ac1-6 重新编号。'],
    ['2018-11','规则 606 修订','l6-ok','生效','路由报告按订单类型细分，写明每家场所的付费与返还金额；应客户要求提供「不持有」订单的路由报告。'],
    ['2020-12-17','罗宾汉最佳执行案','l6-ok','已结案','SEC 认定客户合计少得 3,410 万美元；罗宾汉支付 6,500 万美元民事罚款。'],
    ['2021-01','GameStop 行情','l6-ok','事件','1 月 27 日收于 347.51 美元；1 月 28 日几家零售券商限制买入。SEC 工作人员 2021 年 10 月发布报告。'],
    ['2022-12-14','四项市场结构提案','l6-no','部分撤回','订单竞争规则与最佳执行条例于 2025 年 6 月 12 日撤回；规则 605 修订与报价单位、接入费修订在 2024 年通过。'],
    ['2024-03-06','规则 605 修订','l6-ok','2026-08-01 起合规','客户账户数不少于 10 万的经纪商须每月公开执行质量；合规日期由 2025 年 12 月 14 日推迟到 2026 年 8 月 1 日。'],
    ['2024-09-18','报价单位与接入费修订','l6-wait','推迟到 2027-11','半美分报价单位；接入费上限从每股 0.3 美分降到 0.1 美分。哥伦比亚特区巡回上诉法院 2025 年 10 月 14 日驳回复审请求；合规日期经两次豁免推迟到 2027 年 11 月第一个工作日。'],
    ['2026-06-11','提议撤销规则 611','l6-wait','提案','同时提议撤销规则 610(e)；意见征集截至 2026 年 8 月 17 日，截至 2026 年 11 月尚未通过。']];
  const g=document.getElementById('l6'),h=document.getElementById('l6-h'),x=document.getElementById('l6-x');
  g.innerHTML=E.map(e=>`<button type="button"><time>${e[0]}</time><b>${e[1]}</b><span class="l6-s ${e[2]}">${e[3]}</span></button>`).join('');
  const bs=[...g.children];const set=i=>{bs.forEach((b,j)=>b.classList.toggle('on',i===j));h.textContent=E[i][0]+' · '+E[i][1];x.textContent=E[i][4];};
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));set(7);
})();
</script>
