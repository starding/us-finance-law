<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">同一笔成交，报给四个方向</p><p class="figsub">点选一个接收方，看时限与报告内容。看 CAT 时可切换年份，比较 2026 年删除了哪些客户信息。</p></div></div>
    <div class="c7-tabs" id="c7-tabs"></div>
    <div class="c7-tl" id="c7-tl"></div>
    <div class="c7-yr" id="c7-yr"><button type="button">2024 年</button><button type="button" class="on">2026 年 11 月</button></div>
    <div class="c7-f" id="c7-f"></div>
    <p class="c7-m" id="c7-m" aria-live="polite"></p>
  </div>
</figure>
<style>
.c7-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.c7-tabs button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 6px;line-height:1.35}
.c7-tabs button small{display:block;color:var(--muted);font-size:11.5px}
.c7-tabs button.on{border-color:var(--accent);background:var(--accent-soft)}
.c7-tl{position:relative;height:54px;border-bottom:2px solid var(--line);margin:0 8px 10px}
.c7-tl i{position:absolute;bottom:-7px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:2px solid var(--faint)}
.c7-tl i.on{background:var(--accent);border-color:var(--accent)}
.c7-tl span{position:absolute;bottom:12px;transform:translateX(-50%);font-size:11.5px;color:var(--faint);white-space:nowrap;text-align:center;line-height:1.3}
.c7-tl span.on{color:var(--accent);font-weight:600}
.c7-yr{display:none;gap:6px;margin:6px 0 10px}
.c7-yr.show{display:flex}
.c7-yr button{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 11px}
.c7-yr button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.c7-f{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.c7-f b{font-weight:400;font-size:12.5px;background:var(--quote);border-radius:6px;padding:4px 8px}
.c7-f b.gone{text-decoration:line-through;color:var(--faint);background:transparent;border:1px dashed var(--line)}
.c7-m{font-size:14px;margin:12px 0 0;min-height:3em;line-height:1.6}
@media (max-width:640px){.c7-tabs{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
(function(){
  const T=[['成交',2],['10 秒',16],['交易完成时',44],['次日早 8 点',62],['T+1 交收',80],['每季度',96]];
  const R=[
    ['公众行情','FINRA 交易报告设施',1,[['证券',1],['价格',1],['数量',1],['成交时间',1]],'场外成交在 10 秒内报告并进入公开行情；报告不含客户身份。零碎股成交自 2026 年 2 月 23 日起按新字段报告。'],
    ['客户','成交确认（规则 10b-10）',2,[['日期与时间（或可应要求提供）',1],['证券、价格、数量',1],['代理人或自营商身份',1],['收取的报酬',1],['是否收取订单流付费',1]],'书面确认在交易完成时或之前发出；App 推送不能替代。此后至少每季度寄送对账单（FINRA 规则 2231）。'],
    ['CAT','合并审计追踪（规则 613）',3,null,''],
    ['清算机构','NSCC 与 DTC',4,[['净额结算后的应收应付',1],['证券交收',1]],'2024 年 5 月 28 日起 T+1 交收；机构交易的分配、确认与核对须在成交当天完成（规则 15c6-2）。']];
  const C24=[['订单接收、路由、修改、撤销、成交、分配事件',1],['各事件时间戳',1],['券商指定的客户编号',1],['经转换的客户标识',1],['客户姓名',1],['客户地址',1],['出生年份',1],['大额交易者编号',1],['法人识别编码',1]];
  const C26=[['订单接收、路由、修改、撤销、成交、分配事件',1],['各事件时间戳',1],['券商指定的客户编号',1],['经转换的客户标识',1],['客户姓名',0],['客户地址',0],['出生年份',0],['大额交易者编号',0],['法人识别编码',0]];
  const tabs=document.getElementById('c7-tabs'),tl=document.getElementById('c7-tl'),yr=document.getElementById('c7-yr'),f=document.getElementById('c7-f'),m=document.getElementById('c7-m');
  tabs.innerHTML=R.map(r=>'<button type="button">'+r[0]+'<small>'+r[1]+'</small></button>').join('');
  let cur=0,y=1;const tb=[...tabs.children],yb=[...yr.children];
  function draw(){const r=R[cur];tb.forEach((b,i)=>b.classList.toggle('on',i===cur));yb.forEach((b,i)=>b.classList.toggle('on',i===y));
    tl.innerHTML=T.map((t,i)=>'<i style="left:'+t[1]+'%" class="'+(i===r[2]||i===0?'on':'')+'"></i><span style="left:'+t[1]+'%" class="'+(i===r[2]?'on':'')+'">'+t[0]+'</span>').join('');
    yr.classList.toggle('show',cur===2);
    const fs=cur===2?(y?C26:C24):r[3];
    f.innerHTML=fs.map(x=>'<b class="'+(x[1]?'':'gone')+'">'+x[0]+'</b>').join('');
    m.textContent=cur===2?(y?'2026 年 1 月 13 日起不再报告客户姓名、地址与出生年份，并删除此前报告的这类信息；3 月 27 日的修订以精简的参考数据库取代原客户信息系统，不再报告大额交易者编号与法人识别编码，并删除三年以前的数据。订单事件仍须在次一交易日早 8 点前报告。':'2024 年时，经纪商除订单事件外，还要报告自然人客户的姓名、地址与出生年份。2025 年 2 月 10 日起，SEC 以豁免令允许不再报告这三项。'):r[4];}
  tb.forEach((b,i)=>b.addEventListener('click',()=>{cur=i;draw();}));yb.forEach((b,i)=>b.addEventListener('click',()=>{y=i;draw();}));draw();
})();
</script>
