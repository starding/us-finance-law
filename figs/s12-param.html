<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">把哪些认知劳动交给 AI</p><p class="figsub">打开一个或几个环节，看前 16 章中哪些问题的前提随之改变。点选一章看改变的是什么。</p></div></div>
    <div class="k12p-t" id="k12p-t"></div>
    <div class="k12p-g" id="k12p-g"></div>
    <p class="k12p-m" id="k12p-m" aria-live="polite"></p>
  </div>
</figure>
<style>
.k12p-t{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.k12p-t button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.k12p-t button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.k12p-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.k12p-g button{font:inherit;font-size:13px;text-align:left;cursor:pointer;border:1px solid transparent;background:var(--quote);color:var(--faint);border-radius:9px;padding:8px 10px;line-height:1.4;transition:background .2s,color .2s}
.k12p-g button span{display:block;font-size:11.5px}
.k12p-g button.hit{background:var(--accent-soft);color:var(--ink)}
.k12p-g button.on{border-color:var(--accent)}
.k12p-m{font-size:14px;margin:12px 0 0;min-height:3.2em;line-height:1.6}
@media (max-width:640px){.k12p-g{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
  const S=['生成内容（文字、影像）','解读材料','作出推荐','执行交易'];
  const C=[['第 1 章','发行时的信息',[1],'招股说明书由平台的 AI 压成摘要，投资者读的不再是发行人写的原文。'],
    ['第 2 章','二级市场的反欺诈',[0,1],'上市公司对 AI 能力的陈述成为新的不实陈述来源；AI 生成的文字也可能误导。'],
    ['第 3 章','持续披露',[0],'年报与公告可以由 AI 起草，公司自身使用 AI 的风险与事故是否、何时要报告。'],
    ['第 4 章','什么算证券',[3],'以「AI 交易」为卖点汇集资金、承诺收益的计划，形式新，实质仍是投资合同。'],
    ['第 5 章','中间人的利益',[2],'推荐由算法作出，数量大、因人而异；冲突可以写进模型的优化目标。'],
    ['第 6 章','客户资产',[3],'代理持有登录凭证与交易接口，未经授权的交易从入口发生。'],
    ['第 7 章','价格从哪里来',[1,3],'AI 在对话中读行情、报价格，客户或代理随即下单；读的是哪一路数据要说清。'],
    ['第 8 章','订单执行',[3],'客户的代理替客户选择经纪商、订单类型与时机。'],
    ['第 9 章','价格被扭曲',[0,3],'假新闻与深度伪造更便宜；相似模型可能同时作出同向交易。'],
    ['第 10 章','借钱买证券',[3],'代理一天之内可以大量交易、快速加杠杆，每天一次的计算追不上实时敞口。'],
    ['第 11 章','货架上的产品',[2],'AI 按画像推送杠杆 ETF 与期权策略，推荐与自主交易的边界变得模糊。'],
    ['第 12 章','替人管钱',[2],'机器人顾问与客户自用的通用 AI，都在给出个性化的投资建议。'],
    ['第 13 章','开户的人是谁',[0],'证件、自拍与视频可以用生成式 AI 伪造，核对证件的前提不再成立。'],
    ['第 14 章','能说什么',[0,1,2],'每位客户收到的解读与回答都不同、实时生成，事前逐份批准做不到。'],
    ['第 15 章','跨境',[1,2],'同一个模型对各地用户给出个性化回答，比静态网站更接近招揽。'],
    ['第 16 章','违规之后',[0,2],'误导可以由模型批量产生，没有任何人有意为之；追究要先还原模型说了什么。']];
  const st=new Set([2]);let sel=3;
  const t=document.getElementById('k12p-t'),g=document.getElementById('k12p-g'),m=document.getElementById('k12p-m');
  t.innerHTML=S.map(s=>`<button type="button">${s}</button>`).join('');
  g.innerHTML=C.map(c=>`<button type="button"><span>${c[0]}</span>${c[1]}</button>`).join('');
  const tb=[...t.children],gb=[...g.children];
  function upd(){tb.forEach((b,i)=>b.classList.toggle('on',st.has(i)));let n=0;
    gb.forEach((b,i)=>{const h=C[i][2].some(k=>st.has(k));b.classList.toggle('hit',h);b.classList.toggle('on',i===sel);if(h)n++;});
    const c=C[sel],h=c[2].some(k=>st.has(k));
    m.textContent=`受影响的问题：${n} / ${C.length}。${c[0]}：`+(h?c[3]:`当前打开的环节不改变这一章的前提；打开「${c[2].map(k=>S[k]).join('」或「')}」试试。`);}
  tb.forEach((b,i)=>b.addEventListener('click',()=>{st.has(i)?st.delete(i):st.add(i);upd();}));
  gb.forEach((b,i)=>b.addEventListener('click',()=>{sel=i;upd();}));upd();
})();
</script>
