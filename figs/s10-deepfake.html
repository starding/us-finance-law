<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">远程开户时的深度伪造信号</p><p class="figsub">勾选在一次开户中观察到的信号，看它们落在开户流程的哪一层。信号来自 FinCEN 2024 年 11 月 13 日的警示（FIN-2024-Alert004）；单个信号不必然意味着可疑，需结合整体情况判断。</p></div></div>
    <div class="q10k-list" id="q10k-l"></div>
    <div class="q10k-layers" id="q10k-y"></div>
    <p class="q10k-m" id="q10k-m" aria-live="polite"></p>
  </div>
</figure>
<style>
.q10k-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.q10k-list label{display:flex;gap:8px;align-items:flex-start;background:var(--quote);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.5;cursor:pointer;border:1px solid transparent}
.q10k-list label.on{border-color:var(--accent);background:var(--accent-soft)}
.q10k-list input{accent-color:var(--accent);margin-top:3px}
.q10k-layers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.q10k-layers div{border-radius:9px;padding:8px 10px;background:var(--quote);font-size:12.5px;color:var(--muted)}
.q10k-layers div b{display:block;font-size:18px;color:var(--ink)}
.q10k-layers div.on{background:var(--accent);color:var(--bg)}.q10k-layers div.on b{color:var(--bg)}
.q10k-m{font-size:14px;margin:12px 0 0;min-height:2.6em;line-height:1.65}
@media (max-width:640px){.q10k-list{grid-template-columns:1fr}.q10k-layers{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
  const L=['证件审查','实时核验','设备与位置','开户后监控'];
  const F=[['照片有修改痕迹，或与证件上的年龄不符',0],['多份证件彼此不一致',0],['反向图片搜索：证件照出现在 AI 生成人脸图库',0],['深度伪造检测软件对照片或视频报警',1],['实时核验时使用第三方摄像头插件，或借口故障要求改用其他方式',1],['拒绝多因素认证',1],['地理位置或设备数据与证件信息不符',2],['新账户短期内大量快速交易、向高风险收款方付款或大量退单',3]];
  const l=document.getElementById('q10k-l'),y=document.getElementById('q10k-y'),m=document.getElementById('q10k-m');
  l.innerHTML=F.map((f,i)=>`<label><input type="checkbox" data-i="${i}" ${i===4||i===6?'checked':''}><span>${f[0]}</span></label>`).join('');
  y.innerHTML=L.map(x=>`<div><b>0</b>${x}</div>`).join('');
  const cbs=[...l.querySelectorAll('input')],cells=[...y.children];
  function run(){
    const c=[0,0,0,0];let n=0;cbs.forEach(x=>{x.parentNode.classList.toggle('on',x.checked);if(x.checked){c[F[+x.dataset.i][1]]++;n++;}});
    cells.forEach((e,i)=>{e.querySelector('b').textContent=c[i];e.classList.toggle('on',c[i]>0);});
    m.textContent=n===0?'没有勾选信号。':n===1?'一个信号：需要结合其他信息判断，可以要求补充核验。':`${n} 个信号，分布在 ${c.filter(Boolean).length} 层。多个信号同时出现时，应考虑拒绝开户或在开户后提交可疑活动报告，并在报告中注明 FIN-2024-DEEPFAKEFRAUD。`;
  }
  cbs.forEach(x=>x.addEventListener('change',run));run();
})();
</script>
