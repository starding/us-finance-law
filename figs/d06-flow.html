<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">一笔订单从填写到成交回报</p><p class="figsub">点选一个步骤，看这一步涉及哪些规则、现状如何。日期与数字与正文一致。</p></div></div>
    <div class="f6" id="f6">
      <ol class="f6-s" id="f6-s"></ol>
      <div class="f6-d" id="f6-d" aria-live="polite"></div>
    </div>
  </div>
</figure>
<style>
.f6{display:grid;grid-template-columns:minmax(200px,38%) 1fr;gap:16px;align-items:start}
.f6-s{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:f6n}
.f6-s button{font:inherit;font-size:13.5px;width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;border:1px solid transparent;background:var(--quote);color:var(--ink);border-radius:9px;padding:8px 10px}
.f6-s button b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--muted);font-size:12px;font-weight:600}
.f6-s button.on{border-color:var(--accent);background:var(--accent-soft)}
.f6-s button.on b{background:var(--accent);color:var(--card)}
.f6-d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:14em}
.f6-d>p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.6}
.f6-r{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:2px}
.f6-r strong{font-size:14px}
.f6-r span{font-size:12.5px;color:var(--muted)}
.f6-r em{font-style:normal;font-size:13px}
.f6-r i{font-style:normal;font-size:11.5px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.f6-r a{color:var(--accent);font-size:12.5px}
@media (max-width:640px){.f6{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const D=[["填写订单", "客户看着报价，选择方向、数量（整股、零碎股或按金额）、订单类型、有效期，以及是否允许在盘前、盘后或夜盘成交。", [["延长时段交易风险披露", "FINRA 规则 2265 · FINRA", "2009 年 3 月 27 日起有效；须披露流动性低、波动大等六项风险，在线提供的须在网站公布", "", false], ["下单页面的统一显示（NBBO 与最新成交）", "规则 603(c) · SEC", "有效；不得以 15 分钟延迟数据代替实时数据，手机端与改单页同样适用", "s15", false], ["延迟行情的标注", "统一行情计划数据政策 · 行情计划", "延迟 15 分钟以上的数据须醒目标注；2027 年 4 月 1 日起由 CT 计划统一管理", "s15", true], ["夜盘交易（23×5）", "交易所规则与 SEC 有条件批准 · SEC", "预计 2026 年 12 月 6 日开始，以行情处理器就绪为前提；统一行情 6 月 26 日获批延长到夜间", "s15", true]]], ["下单前检查", "系统核对购买力，给卖单做标记，确认空头卖单能借到券，再经过信用、资本与错误订单阈值控制。", [["日内保证金标准", "FINRA 规则 4210 · FINRA", "2026 年 6 月 4 日生效，最迟 2027 年 10 月 20 日全面实施", "s08", true], ["卖单标记：多头、空头、豁免卖空", "SHO 条例规则 200(g) · SEC", "有效", "s07", false], ["卖空前找券", "SHO 条例规则 203(b) · SEC", "有效", "s07", false], ["市场准入风险控制", "规则 15c3-5 · SEC", "2010 年 11 月 3 日通过，2011 年 7 月 14 日起须遵守", "", false]]], ["路由", "订单送到做市商、交易所或另类交易系统；券商按最佳执行义务选择去向，并公开路由去向与订单流付费。", [["最佳执行", "FINRA 规则 5310 · FINRA", "有效；2026 年 7 月 24 日第 26-15 号通知就指引征求意见", "s06", true], ["订单路由披露", "规则 606 · SEC", "有效；每季度公开", "s06", false], ["订单保护", "规则 611 · SEC", "2026 年 6 月 11 日提议撤销，尚未通过", "s06", true]]], ["持单与执行", "可立即成交的订单成交；暂时不能成交的限价单被持有，券商不得以能满足它的价格先为自己成交。零碎部分通常由券商以自营身份承接。", [["限价单保护", "FINRA 规则 5320 · FINRA", "2011 年 9 月 12 日起有效；1 美元以上 NMS 股票须至少改善 1 美分；2025 年 12 月配合整手定义修订", "", true], ["整手定义", "全国市场体系条例规则 600(b)(93) · SEC", "2025 年 11 月 3 日实施，按股价分配整手大小", "s06", true], ["零碎股成交报告", "FINRA 交易报告规则 · FINRA", "NMS 股票自 2026 年 2 月 23 日起按新字段报告", "", true]]], ["市场异常", "个股触及价格带先进入 15 秒限价状态，仍不能回到带内则暂停 5 分钟；标普 500 跌 7%、13% 暂停 15 分钟，跌 20% 当日停止交易。", [["个股涨跌停（LULD 计划）", "全国市场体系计划 · SEC 批准", "2013 年起施行，2019 年 4 月 11 日转为永久；2026 年 8 月 5 日批准夜盘 20% 静态价格带", "", true], ["全市场熔断", "交易所与 FINRA 规则", "现行 7%、13%、20% 的设计 2012 年批准、2013 年起施行", "", false]]], ["成交回报", "客户看到成交价格与数量；交易进入结算、确认与报告。", [["执行质量月报", "规则 605 · SEC", "2026 年 8 月 1 日起，客户账户数不少于 10 万的经纪商须编制", "s06", true], ["成交确认与报告", "规则 10b-10、FINRA 交易报告规则、CAT", "见阶段 7", "d07", true]]]];
  const s=document.getElementById('f6-s'),d=document.getElementById('f6-d');
  s.innerHTML=D.map((x,i)=>`<li><button type="button"><b>${i+1}</b><span>${x[0]}</span></button></li>`).join('');
  const bs=[...s.querySelectorAll('button')];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('on',i===j));const x=D[i];
    d.innerHTML='<p>'+x[1]+'</p>'+x[2].map(r=>'<div class="f6-r"><strong>'+r[0]+(r[4]?'<i>2023–2026 有变化</i>':'')+'</strong><span>'+r[1]+'</span><em>'+r[2]+'</em>'+(r[3]?'<a href="'+r[3]+'.html">详见'+(r[3][0]==='s'?'第 '+({s01:1,s02:2,s13:3,s03:4,s04:5,s05:6,s15:7,s06:8,s07:9,s08:10,s18:11,s09:12,s10:13,s11:14,s16:15,s17:16,s12:17}[r[3]]||'')+' 章':'阶段 '+(+r[3].slice(1)))+' →</a>':'')+'</div>').join('');}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));set(0);
})();
</script>
