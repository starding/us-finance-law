<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">加密资产与证券法：2017–2026</p><p class="figsub">按来源筛选，点选一个节点看内容与截至 2026 年 11 月的状态。</p></div></div>
    <div class="s3cr-f" id="s3cr-f"><button type="button" data-v="all">全部</button><button type="button" data-v="sec">SEC</button><button type="button" data-v="court">法院</button><button type="button" data-v="cong">国会</button></div>
    <div class="s3cr-tl" id="s3cr-tl"></div>
    <div class="s3cr-d"><p class="s3cr-h"><b id="s3cr-t"></b><span id="s3cr-s"></span></p><p id="s3cr-x"></p></div>
  </div>
</figure>
<style>
.s3cr-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.s3cr-f button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.s3cr-f button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.s3cr-tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-bottom:12px}
.s3cr-n{font:inherit;text-align:left;cursor:pointer;border:1px solid transparent;background:var(--quote);color:var(--ink);border-radius:9px;padding:8px 10px;transition:opacity .3s}
.s3cr-n em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}.s3cr-n b{font-size:13px;font-weight:600}
.s3cr-n.dim{opacity:.25}.s3cr-n.on{border-color:var(--accent)}
.s3cr-d{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6}
.s3cr-d p{margin:0}.s3cr-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px!important}
.s3cr-h span{font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 9px}
</style>
<script>
(function(){
  const D=[['2017-07-25','sec','DAO 报告','SEC 调查报告认定 DAO 代币是证券，未提起执法。','已发布'],
    ['2020-12-22','sec','起诉瑞波','SEC 起诉瑞波公司及两名高管，指出售 XRP 为未注册发行。','2025 年结案'],
    ['2023-07-13','court','瑞波案判决','纽约南区法院：机构销售约 7.28 亿美元是投资合同，交易所程序化销售不是。','未经上诉审查'],
    ['2024-08-07','court','瑞波案终局判决','对机构销售部分判处 125,035,150 美元民事罚款并发布禁令。','有效'],
    ['2025-01-21','sec','成立加密工作组','代理主席尤耶达宣布成立，由皮尔斯委员领导，目标是以规则代替逐案执法。','运作中'],
    ['2025-02-27','sec','撤销 Coinbase 案','SEC 与 Coinbase 共同申请撤诉，SEC 说明不代表对是非的判断；5 月 29 日币安案同样撤销。','已撤诉'],
    ['2025-07-18','cong','GENIUS 法','获准发行人发行的支付型稳定币不属于证券；储备 1:1，不得付息。','2027 年 1 月 18 日前后生效'],
    ['2025-07-17','cong','众议院通过 CLARITY 法','294 票对 134 票通过市场结构法案。','送交参议院'],
    ['2025-08-07','court','瑞波案上诉撤回','双方撤回上诉；此前把罚款减为 5,000 万美元的请求被法院拒绝。','原判决生效'],
    ['2026-03-17','sec','代币分类解释','五类：数字商品、数字收藏品、数字工具、稳定币、数字证券；投资合同可以结束。CFTC 同时加入。','有效'],
    ['2026-08-18','sec','加密资产条例（提案）','500 万美元初创豁免、7,500 万美元募资豁免与安全港。','征求意见已结束，未通过'],
    ['2026-09-15','cong','参议院程序表决','开始审议 CLARITY 法的动议以 49 票对 50 票未获通过，需要 60 票。','搁置；2027 年 1 月 3 日本届国会结束']];
  D.sort((a,b)=>a[0]<b[0]?-1:1);
  const tl=document.getElementById('s3cr-tl'),t=document.getElementById('s3cr-t'),s=document.getElementById('s3cr-s'),x=document.getElementById('s3cr-x');
  tl.innerHTML=D.map(d=>`<button type="button" class="s3cr-n" data-k="${d[1]}"><em>${d[0]}</em><b>${d[2]}</b></button>`).join('');
  const ns=[...tl.children];
  const set=i=>{ns.forEach((n,j)=>n.classList.toggle('on',i===j));t.textContent=D[i][0]+' · '+D[i][2];s.textContent=D[i][4];x.textContent=D[i][3];};
  ns.forEach((n,i)=>n.addEventListener('click',()=>set(i)));
  const fb=[...document.querySelectorAll('#s3cr-f button')];
  const filt=k=>{fb.forEach(b=>b.classList.toggle('on',b.dataset.v===k));ns.forEach(n=>n.classList.toggle('dim',k!=='all'&&n.dataset.k!==k));};
  fb.forEach(b=>b.addEventListener('click',()=>filt(b.dataset.v)));filt('all');set(D.length-3);
})();
</script>
