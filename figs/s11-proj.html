<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">哪些「未来的数字」可以写</p><p class="figsub">切换规则版本与受众。2026 年修订已于 10 月 15 日获 SEC 批准，生效日期待 FINRA 公告。</p></div></div>
    <div class="k11j-q"><span>规则</span><div class="k11j-b" id="k11j-v"><button type="button" data-v="0">现行规则</button><button type="button" data-v="1">2026 年修订后</button></div></div>
    <div class="k11j-q"><span>受众</span><div class="k11j-b" id="k11j-a"><button type="button" data-v="0">一般零售大众</button><button type="button" data-v="1">经判断有资源与专业能力的特定受众</button></div></div>
    <div class="k11j-t" id="k11j-t"></div>
  </div>
</figure>
<style>
.k11j-q{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
.k11j-b{display:flex;gap:6px;flex-wrap:wrap}.k11j-b button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.k11j-b button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.k11j-t{display:grid;gap:6px;margin-top:10px}
.k11j-r{display:grid;grid-template-columns:170px 70px 1fr;gap:10px;align-items:start;padding:9px 12px;border-radius:9px;background:var(--quote);font-size:13.5px;line-height:1.5}
.k11j-r b{font-weight:600}.k11j-r span.y{color:var(--accent);font-weight:600}.k11j-r span.n{color:var(--faint);font-weight:600}
.k11j-r.ch{outline:1px solid var(--accent)}
@media (max-width:640px){.k11j-r{grid-template-columns:1fr}}
</style>
<script>
(function(){
  // 每项：[名称, (版本,受众)=>[可以?, 说明]]
  const R=[['说明复利原理的计算',()=>[1,'例外 (i)：不预测具体投资的业绩']],
    ['投资分析工具',()=>[1,'例外 (ii)：须符合规则 2214 的条件']],
    ['研究报告中的目标价',()=>[1,'例外 (iii)：有合理依据，披露估值方法与风险']],
    ['发行人经营指标的预测',()=>[1,'常见问题 D.7：对销售额等经营指标的合理预测可以写，不得写成给投资者的收益']],
    ['产品或组合的预估业绩、目标收益',(v,a)=>!v?[0,'现行规则一律禁止；目标收益也属于预测']:a?[1,'新例外 (iv)：有书面政策确保与受众相关；说明标准与假设（含是否扣费）；说明风险与局限']:[0,'修订后仍一般不允许用于面向大众或一般零售投资者的沟通']],
    ['回测业绩、模型组合业绩',()=>[0,'不在新例外 (iv) 的范围内']]];
  const st={v:0,a:0},t=document.getElementById('k11j-t');let prev=null;
  function upd(){['v','a'].forEach(k=>document.getElementById('k11j-'+k).querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===st[k])));
    const now=R.map(r=>r[1](st.v,st.a));
    t.innerHTML=R.map((r,i)=>`<div class="k11j-r${prev&&prev[i][0]!==now[i][0]?' ch':''}"><b>${r[0]}</b><span class="${now[i][0]?'y':'n'}">${now[i][0]?'可以':'不可以'}</span><span>${now[i][1]}</span></div>`).join('');prev=now;}
  ['v','a'].forEach(k=>document.getElementById('k11j-'+k).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{st[k]=+b.dataset.v;upd();})));upd();
})();
</script>
