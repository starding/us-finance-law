<section class="hero" aria-label="封面">
  <canvas class="hero-cv" id="hero-cv" aria-hidden="true"></canvas>
  <div class="hero-top"><span>交互式网页书</span></div>
  <div class="hero-main">
    <h1 class="hero-title"><span>美国金融业</span><span>法律研究</span></h1>
    <p class="hero-sub">规则从何而来</p>
    <div class="hero-author">{credits}</div>
    <div class="hero-act"><a class="hero-start" href="preface.html"><b>开始阅读</b><small>从一个没有证券法的市场出发，逐步推演</small></a><a class="hero-more" href="#about">关于本书</a></div>
  </div>
  <div class="hero-foot"><span>{edition}</span><span class="hero-legend">背景：同一起点出发的数百条价格路径</span></div>
</section>
<style>
.hero{position:relative;min-height:100vh;min-height:100svh;background:#0f1012;color:#ededeb;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--sans)}
.hero-cv{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,16,18,.94) 0%,rgba(15,16,18,.72) 34%,rgba(15,16,18,0) 62%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero>.hero-cv{position:absolute;z-index:0}
.hero-top{display:flex;align-items:center;gap:14px;padding:26px clamp(16px,5vw,64px) 24px max(64px,5vw);font-size:13px;letter-spacing:.16em;color:rgba(241,239,230,.6)}
.hero-main{padding:0 clamp(16px,5vw,64px);max-width:1100px}
.hero-title{font-family:var(--sans);font-weight:600;font-size:clamp(48px,7.6vw,100px);line-height:1.08;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .14em;letter-spacing:-.01em}
.hero-title span{opacity:0;transform:translateY(18px);animation:heroin .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-title span:nth-of-type(2){animation-delay:.15s}.hero-title span:nth-of-type(3){animation-delay:.3s}
.hero-title i{font-style:normal;font-weight:300;color:rgba(237,237,235,.36);opacity:0;animation:heroin .9s ease forwards .45s}
.hero-sub{font-family:var(--sans);font-weight:400;font-size:clamp(18px,2.2vw,26px);margin:18px 0 0;color:rgba(237,237,235,.74);opacity:0;animation:heroin .9s ease forwards .6s}
.hero-author{font-size:14px;margin:22px 0 0;color:rgba(237,237,235,.55);letter-spacing:.02em;line-height:1.9;opacity:0;animation:heroin .9s ease forwards .75s}
.hero-author p{margin:0;display:grid;grid-template-columns:7.2em 1fr;gap:0 .6em}
.hero-author span{color:rgba(237,237,235,.36)}
.hero-act{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px;opacity:0;animation:heroin .9s ease forwards .9s}
.hero-start{background:#ededeb;color:#0f1012;text-decoration:none;padding:12px 22px;border-radius:14px;font-size:15px;font-weight:500;display:flex;flex-direction:column;gap:2px;min-width:200px}
.hero-start small{font-size:12px;font-weight:400;color:rgba(15,16,18,.6)}
.hero-act{align-items:stretch}
.hero-more{display:flex;align-items:center;border-radius:14px;white-space:nowrap}
.hero-start:hover{background:#ffffff;color:#0f1012}
.hero-more{color:#f1efe6;text-decoration:none;padding:12px 22px;border-radius:999px;font-size:15px;border:1px solid rgba(241,239,230,.3)}
.hero-more:hover{border-color:#f1efe6}
.hero-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px clamp(16px,5vw,64px);font-size:12px;color:rgba(241,239,230,.45)}
@keyframes heroin{to{opacity:1;transform:none}}
@media (max-width:640px){.hero-legend{display:none}.hero::after{background:linear-gradient(180deg,rgba(15,16,18,.4),rgba(15,16,18,.78) 45%,rgba(15,16,18,.4))}}
</style>
<script>
(function(){
  const cv=document.getElementById('hero-cv'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,paths=[],hi=[],tb=null,th=null,raf;
  let seed=20261019; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const g=()=>{let u=0,v=0;while(!u)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const STEPS=180;
  function gen(n){const out=[];for(let k=0;k<n;k++){let y=0;const p=[0];for(let i=1;i<=STEPS;i++){y+=0.0009+0.016*g();p.push(y);}out.push(p);}return out;}
  function size(){
    const r=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*r; cv.height=H*r; ctx.setTransform(r,0,0,r,0,0);
  }
  const narrow=()=>W<700, X=i=>narrow()?W*0.04+i/STEPS*W*0.96:W*0.46+i/STEPS*(W*0.56), Y=v=>H*(narrow()?0.3:0.66)-v*H*(narrow()?0.5:0.6);
  function line(p,upto,style,width){
    ctx.beginPath();ctx.moveTo(X(0),Y(p[0]));
    const n=Math.floor(upto*STEPS);for(let i=1;i<=n;i++)ctx.lineTo(X(i),Y(p[i]));
    ctx.strokeStyle=style;ctx.lineWidth=width;ctx.stroke();
    return [X(n),Y(p[n])];
  }
  function frame(ts){
    if(tb===null)tb=ts; if(th===null)th=ts;
    const kb=reduce?1:Math.min(1,(ts-tb)/3200), k=reduce?1:Math.min(1,(ts-th)/3200);
    ctx.clearRect(0,0,W,H);
    paths.forEach(p=>line(p,kb,'rgba(241,239,230,0.055)',1));
    const cols=['#5fbf9f','rgba(237,237,235,.85)','rgba(237,237,235,.45)'];
    hi.forEach((p,j)=>{const kk=Math.max(0,Math.min(1,(k-0.15*j)/0.85));if(kk<=0)return;const [x,y]=line(p,kk,cols[j],1.8);ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fillStyle=cols[j];ctx.fill();});
    // 起点
    ctx.beginPath();ctx.arc(X(0),Y(0),4,0,7);ctx.fillStyle='#f1efe6';ctx.fill();
    if(k<1||kb<1)raf=requestAnimationFrame(frame);
  }
  function start(){cancelAnimationFrame(raf);size();tb=null;th=null;raf=requestAnimationFrame(frame);}
  paths=gen(260); hi=gen(3);
  start();
  let tm; addEventListener('resize',()=>{clearTimeout(tm);tm=setTimeout(()=>{size();tb=-1e9;th=-1e9;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);},150);});
  // 每隔一段时间换一组高亮路径
  if(!reduce) setInterval(()=>{if(document.hidden)return;hi=gen(3);th=null;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);},9000);
})();
</script>
