<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">2020 年行情改革落到了哪一步</p><p class="figsub">市场数据基础设施规则与行情计划治理改革的各个部分，截至 2026 年 11 月的状态。点选一项查看依据。</p></div></div>
    <div class="q7m-g" id="q7m-g"></div>
    <div class="q7m-d" id="q7m-d" aria-live="polite"></div>
  </div>
</figure>
<style>
.q7m-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q7m-g button{font:inherit;text-align:left;cursor:pointer;border:1px solid transparent;background:var(--quote);color:var(--ink);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.q7m-g button b{font-size:13.5px}
.q7m-g button span{font-size:12px;color:var(--muted)}
.q7m-g button i{font-style:normal;font-size:11.5px;justify-self:start;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted)}
.q7m-g button i.s2{border-color:var(--accent);background:var(--accent);color:var(--card)}
.q7m-g button i.s1{border-color:var(--accent);color:var(--accent)}
.q7m-g button.on{border-color:var(--accent);background:var(--accent-soft)}
.q7m-d{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.65;min-height:5em}
.q7m-k{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
@media (max-width:640px){.q7m-g{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
  const X=[
    ['整手按股价分档','2025-11-03 实施',2,'2020 年 12 月 9 日通过（Release No. 34-90610），2024 年 9 月 18 日的修订把实施提前到 2025 年 11 月 3 日。股价不超过 250 美元为 100 股，250.01–1,000 美元 40 股，1,000.01–10,000 美元 10 股，更高为 1 股；每半年按股价重新分档。'],
    ['最优零股报价','2026-04-27 发布',2,'2024 年修订要求处理器自 2026 年 5 月起发布比 NBBO 更好的最优零股买卖报价；处理器在 2026 年 4 月 27 日开始发布。'],
    ['NBBO 之内的零股报价','推迟到 2028-05',1,'原定 2026 年 5 月由处理器发布；2026 年 1 月 15 日 SEC 批准豁免（Release No. 34-104612），推迟到 2028 年 5 月 1 日。'],
    ['竞争性汇总商与扩充内容','尚未启动',0,'深度数据、集合竞价信息与竞争性汇总商，须等行情计划提交规则 614(e) 要求的配套修订并获 SEC 批准。2021 年 11 月 5 日提交的修订于 2022 年 9 月 21 日被否决；截至 2026 年 6 月新修订尚未提交，SEC 称无法估计完成日期。'],
    ['CT 计划统一治理','2027-04-01 运作',1,'2020 年 5 月治理命令；2021 年 8 月批准的计划于 2022 年 7 月 5 日被哥伦比亚特区巡回上诉法院撤销；2023 年 9 月 1 日修改命令；新 CT 计划 2024 年 11 月获批，2025 年 12 月选定独立管理人 DataCT，收费表 2026 年 6 月获批，2027 年 4 月 1 日起运作。处理器仍为 SIAC 与纳斯达克。'],
    ['统一行情延长到夜间','2026-12-06 预计',1,'2026 年 6 月 26 日批准 CTA/CQ 计划修订（Release No. 34-105779）：周日晚 9 点至周五晚 8 点运行，周一至周四晚 8 点至 9 点暂停。以结算、处理器与各上市交易所就绪为前提。']
  ];
  const L=['未启动','已定日期','已实施'];
  const g=document.getElementById('q7m-g'),d=document.getElementById('q7m-d');
  g.insertAdjacentHTML('beforebegin','<p class="q7m-k">'+L.map((t,i)=>'<span>'+['○','◐','●'][i]+' '+t+'</span>').join('')+'</p>');
  g.innerHTML=X.map(x=>`<button type="button"><i class="s${x[2]}">${['○','◐','●'][x[2]]} ${L[x[2]]}</i><b>${x[0]}</b><span>${x[1]}</span></button>`).join('');
  const bs=[...g.children];const set=i=>{bs.forEach((b,j)=>b.classList.toggle('on',i===j));d.innerHTML='<b>'+X[i][0]+'</b>　'+X[i][3];};
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));set(0);
})();
</script>
