<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">逐章重跑：AI 带来的变化与现有规则的覆盖</p><p class="figsub">按覆盖程度筛选；点选一行看没有覆盖到的地方。资料截至 2026 年 11 月。</p></div></div>
    <div class="k12m-f" id="k12m-f"></div>
    <div class="k12m-t" id="k12m-t" role="table"></div>
  </div>
</figure>
<style>
.k12m-f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.k12m-f button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.k12m-f button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.k12m-h,.k12m-r{display:grid;grid-template-columns:118px 1fr 1fr 82px;gap:10px;padding:8px 6px;font-size:13px;line-height:1.5;border-bottom:1px solid var(--line)}
.k12m-h{color:var(--faint);font-size:12px}
.k12m-r{cursor:pointer}.k12m-r:hover{background:var(--quote)}
.k12m-r b{font-weight:600;display:block}.k12m-r small{color:var(--faint);font-size:11.5px}
.k12m-c{font-size:12px;border-radius:999px;padding:2px 8px;height:fit-content;text-align:center;white-space:nowrap}
.k12m-c.c1{background:var(--accent);color:var(--bg)}.k12m-c.c2{background:var(--accent-soft);color:var(--ink)}
.k12m-x{grid-column:1/-1;background:var(--accent-soft);border-radius:8px;padding:8px 10px;display:none}
.k12m-r.open .k12m-x{display:block}
@media (max-width:640px){.k12m-h{display:none}.k12m-r{grid-template-columns:1fr auto}.k12m-r>span:nth-child(2),.k12m-r>span:nth-child(3){grid-column:1/-1}}
</style>
<script>
(function(){
  const R=[['第 1 章','发行时的信息','平台用 AI 把招股说明书压成摘要','第 11 条只约束发行人等；经纪商发出的摘要受规则 2210 约束',2,'摘要的提供者不是经纪商时（例如客户自用的通用 AI），没有对应的责任'],
    ['第 2 章','二级市场的反欺诈','上市公司夸大 AI 能力；AI 生成的误导陈述','规则 10b-5 不问陈述由谁、用什么工具写成（Presto 案，2025 年 1 月）',1,'未见新的空白；专门的 AI 披露要求见第 3 章'],
    ['第 3 章','公司持续披露什么','公司大量使用 AI；AI 相关的风险与事故；AI 起草报告','风险因素、管理层讨论与分析、8-K 第 1.05 项与高管签字认证均技术中立',2,'没有专门的 AI 披露项；投资者咨询委员会 2025 年 12 月 4 日的建议尚未变成规则'],
    ['第 4 章','什么算证券','以「AI 交易」为卖点汇集资金、承诺收益','投资合同标准看交易实质，不看技术',1,'未见新的空白'],
    ['第 5 章','中间人的利益','算法推荐、聊天回答构成推荐；冲突写进优化目标','最佳利益规则适用于 AI 作出的推荐（FINRA 常见问题，2024 年 5 月）',2,'专门针对模型冲突的 2023 年提案已于 2025 年 6 月 12 日撤回'],
    ['第 6 章','客户资产','代理持有登录凭证与交易接口','资产隔离与净资本不受影响；S-P 条例 2024 年修订管数据泄露',2,'客户授权代理之后的越权交易，没有专门规则'],
    ['第 7 章','价格从哪里来','AI 在对话中报价、客户随即下单；代理自行读取行情','统一显示规则适用于可以作出交易决定的任何地方（规则 603(c)）',1,'客户自带代理读取哪一路行情、多快，不在经纪商的义务之内'],
    ['第 8 章','订单执行','代理替客户选择经纪商、订单类型与时机','经纪商的最佳执行义务适用于任何来源的订单',2,'客户一侧代理的选择不属于任何经纪商的义务；最佳执行条例提案已撤回'],
    ['第 9 章','价格被扭曲','AI 生成假新闻与深度伪造；相似模型同向交易','反欺诈与反操纵规则适用于有意的行为；SEC 2025 年 2 月设网络与新兴技术执法组',2,'没有任何人有故意的同向交易，不在反操纵规则之内'],
    ['第 10 章','借钱买证券','代理在一天之内大量交易、快速加杠杆','T 条例与规则 4210 的数量上限不因下单者而改变',1,'日内敞口每天计算一次，实时状况可能更差'],
    ['第 11 章','货架上的产品','AI 按画像推送杠杆 ETF、期权策略；模型给出期权等级','产品规则作用在产品一级；推荐适用最佳利益规则，期权审批须负责人作出（规则 2360）',2,'复杂产品没有审批门槛，推送与推荐的边界不清；22-08 征求意见未成规则'],
    ['第 12 章','替人管钱','机器人顾问；客户用通用 AI 获取个性化建议','受托义务适用于自动化顾问（SEC，2019 年）；互联网顾问豁免 2024 年修订',2,'通用 AI 的提供者是否属于投资顾问，尚无表述'],
    ['第 13 章','开户的人是谁','深度伪造的证件、自拍与视频','客户身份识别的要求不变；FinCEN 警示（2024 年 11 月 13 日）',2,'义务不变，可靠的核实手段要重新选择'],
    ['第 14 章','能说什么','每人一份、实时生成的解读与回答','内容标准适用于 AI 生成的沟通（FINRA，2024 年）',2,'按人数分类与事前逐份批准难以执行'],
    ['第 15 章','跨境','面向全球的 AI 助手对各地用户给出个性化回答','规则 15a-6 的招揽标准与 1998 年境外网站解释仍然适用',2,'AI 回答是否构成跨境招揽，SEC 尚无表述；拦截要落到每一次回答'],
    ['第 16 章','违规之后','模型批量产生误导；虚称使用 AI','执法不问工具：Delphia 与 Global Predictions 案（2024 年 3 月 18 日）；2025 年 AI 相关集团诉讼 16 起',2,'没有任何人故意的模型误导难以按欺诈追究（PSLRA 要求强烈推断故意）；还原事实依赖留存']];
  const L={1:'大体覆盖',2:'部分覆盖'};let f=0;
  const fe=document.getElementById('k12m-f'),te=document.getElementById('k12m-t');
  const F=[[0,'全部'],[1,'大体覆盖'],[2,'部分覆盖']];
  fe.innerHTML=F.map(x=>`<button type="button" data-v="${x[0]}">${x[1]}（${x[0]?R.filter(r=>r[4]===x[0]).length:R.length}）</button>`).join('');
  function upd(){fe.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===f));
    te.innerHTML='<div class="k12m-h"><span>章与问题</span><span>AI 带来的新形式</span><span>现有规则</span><span>覆盖</span></div>'+R.filter(r=>!f||r[4]===f).map(r=>`<div class="k12m-r" role="row"><span><b>${r[1]}</b><small>${r[0]}</small></span><span>${r[2]}</span><span>${r[3]}</span><span class="k12m-c c${r[4]}">${L[r[4]]}</span><div class="k12m-x">没有覆盖到：${r[5]}</div></div>`).join('');
    te.querySelectorAll('.k12m-r').forEach(e=>e.addEventListener('click',()=>e.classList.toggle('open')));}
  fe.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{f=+b.dataset.v;upd();}));upd();
})();
</script>
