<script>
(function(){
  const R=[{"f": "s01", "no": 1, "title": "卖的人比买的人知道得多", "cards": [{"name": "蓝天法（州证券法）", "text": "在本州出售证券之前须向州政府登记，州政府可以审查发行是否公平、合理，并拒绝不合格的发行。", "year": 1911, "years": [1911], "by": "堪萨斯州，1911；推动者为州银行专员多利", "kind": "原理", "ask": "卖的人比买的人知道得多，买方无法判断发行的好坏"}, {"name": "发行注册与招股说明书", "text": "未向 SEC 提交注册声明并使其生效，不得公开发售证券；向投资者发售时须提供载明法定信息的招股说明书。", "year": 1933, "years": [1933, 1934], "by": "美国国会，1933；最初由联邦贸易委员会执行，1934 年起由新设立的 SEC 执行", "kind": "原理", "ask": "州法管不到跨州发行；政府判断好坏既难又有风险"}, {"name": "注册声明的民事责任", "text": "注册声明含有重大不实陈述或遗漏时，购买者可向发行人、签字人、董事、承销商与相关专家求偿；除发行人外，被告可以尽职调查为抗辩。", "year": 1933, "years": [1933], "by": "美国国会，1933", "kind": "原理", "ask": "只要求披露、不追究假话，披露就没有分量"}, {"name": "私募发行豁免与 D 条例", "text": "不涉及公开发行的交易免于注册；向合格投资者出售、并满足 D 条例条件的发行，可以确定地获得豁免。", "year": 1933, "years": [1933, 1953, 1982, 2013, 2020], "by": "美国国会，1933；联邦最高法院，1953；SEC，1982（D 条例）、2013（规则 506(c)）、2020（扩大合格投资者定义）", "kind": "原理", "ask": "注册程序繁重，对能自我保护的买方并无必要"}]}, {"f": "s02", "no": 2, "title": "证券转手之后，谁来说真话", "cards": [{"name": "持续披露（定期报告）", "text": "证券在交易所上市或达到规定的股东与资产门槛的公司，须向 SEC 注册，并按规定期限提交年报、季报与重大事件的当期报告。", "year": 1934, "years": [1934, 2004], "by": "美国国会，1934；SEC 此后以规则规定表格与期限，8-K 的四个工作日时限自 2004 年起适用", "kind": "原理", "ask": "发行时的披露很快过时，二级市场的价格需要持续更新的信息"}, {"name": "规则 10b-5（反欺诈）", "text": "任何人在与买卖证券有关的活动中，不得使用欺诈手段，不得作出重大不实陈述或误导性的遗漏。", "year": 1942, "years": [1942], "by": "SEC，1942", "kind": "原理", "ask": "定期报告要求公司说话，但没有规定说假话的后果；原有规则只管卖方的欺诈"}, {"name": "欺诈市场推定与重大性标准", "text": "在有效运转的市场中，按市场价格买卖证券的投资者，可推定依赖了公开的重大不实陈述；一项事实是否重大，看理性投资者是否很可能认为它重要，对不确定事件要同时衡量可能性与影响程度。", "year": 1988, "years": [1988], "by": "联邦最高法院，1988；布莱克门大法官执笔", "kind": "原理", "ask": "交易所中的投资者匿名成交、多数未读过公告，逐一证明依赖会使集团诉讼无法进行"}]}, {"f": "s03", "no": 3, "title": "什么算证券", "cards": [{"name": "投资合同（Howey 测试）", "text": "一项安排同时具备四个要素即为投资合同，属于证券：投入金钱、投入共同事业、期望获得利润、利润来自他人的努力。", "year": 1946, "years": [1946], "by": "联邦最高法院，1946；墨菲大法官执笔", "kind": "原理", "ask": "发行人可以把证券设计成不具备股票、债券形式的安排，绕开注册与披露"}, {"name": "票据的家族相似测试", "text": "票据推定为证券；与法院列举的非证券票据足够相似的除外，相似与否看动机、分销方式、公众的合理预期与是否有其他降低风险的监管。", "year": 1990, "years": [1990], "by": "联邦最高法院，1990；马歇尔大法官执笔", "kind": "原理", "ask": "票据既用于投资也用于普通借贷，一律视为证券或一律排除都不合理"}, {"name": "投资合同的进入与退出（2026 年解释）", "text": "一项本身不是证券的加密资产，因发行人关于关键管理努力的承诺而成为投资合同的标的；发行人兑现或公开放弃这些承诺后，它不再受投资合同约束，此后的交易不受证券法管辖。", "year": 2026, "years": [2026], "by": "SEC，2026；CFTC 同时加入", "kind": "原理", "ask": "同一种代币在发行初期依赖团队、成熟后依赖网络，一次性的「是或不是」无法描述"}]}, {"f": "s04", "no": 4, "title": "中间人有自己的利益", "cards": [{"name": "自律监管（FINRA）", "text": "经纪自营商须加入受 SEC 监督的全国性证券协会，由协会制定行为规则、检查会员、处罚违规并考核从业人员资格。", "year": 1938, "years": [1938, 1939, 2007], "by": "美国国会，1938；NASD，1939；FINRA，2007", "kind": "原理", "ask": "中间人数量多、行为分散，政府机构难以逐一监督"}, {"name": "适当性（FINRA 规则 2111）", "text": "推荐证券交易或投资策略时，须有合理依据相信它适合客户；须了解产品本身、了解这位客户，并且一系列交易合在一起不能过度。", "year": 1939, "years": [1939, 2012], "by": "NASD，1939 年起见于《公平交易规则》第三条第 2 节（后编为规则 2310）；FINRA 规则 2111 于 2012 年 7 月 9 日施行", "kind": "原理", "ask": "真实的推荐也可能对客户有害；规则 10b-5 只管假话"}, {"name": "最佳利益规则（Reg BI）", "text": "经纪自营商向散户客户推荐时，须以推荐时客户的最佳利益行事，不得把自身利益置于客户之前；通过披露、注意、利益冲突与合规四项义务来满足。", "year": 2019, "years": [2019], "by": "SEC，2019", "kind": "原理", "ask": "适当性只是下限，推荐人可以在合适的产品中挑对自己最有利的一种"}]}, {"f": "s05", "no": 5, "title": "客户的钱放在经纪商那里", "cards": [{"name": "SIPA 与 SIPC", "text": "经纪商倒闭时，由法院指定的受托人优先把客户资产还给客户；客户资产不足时，SIPC 以会员出资的基金垫付，每名客户以 50 万美元为限，其中现金以 25 万美元为限。", "year": 1970, "years": [1970], "by": "美国国会，1970", "kind": "原理", "ask": "经纪商倒闭时客户资产与经纪商财产混在一起，客户与其他债权人一起受偿"}, {"name": "客户资产保护规则", "text": "经纪商对客户已付款的证券须保持占有或控制；对客户现金须按储备金公式计算，客户贷方超过客户借方的部分须存入专为客户利益开设的银行账户。", "year": 1972, "years": [1972], "by": "SEC，1972", "kind": "原理", "ask": "客户资产与经纪商财产混在一起，经纪商倒闭时客户只是普通债权人"}, {"name": "净资本规则", "text": "经纪商须保持按规定扣减与折扣后计算的流动资本不低于法定最低额；持有客户资产的经纪商要求更高。", "year": 1975, "years": [1975], "by": "SEC，1975", "kind": "原理", "ask": "资本不足的经纪商在市场波动时容易倒闭，倒闭时难以有序转移客户账户"}]}, {"f": "s06", "no": 6, "title": "订单送到哪里成交", "cards": [{"name": "最佳执行义务", "text": "经纪商应以合理的勤勉为客户订单确定最佳市场，使客户得到的价格在当时的市场条件下尽可能有利，并定期且严格地审查执行质量。", "year": 2012, "years": [2012], "by": "普通法与行业自律；FINRA，2012", "kind": "原理", "ask": "经纪商替客户选择交易场所，客户看不到，也无法比较"}, {"name": "全国市场体系条例", "text": "各交易场所须防止以劣于其他场所受保护报价的价格成交，须允许公平接入其报价并遵守接入费上限，股价不低于 1 美元的股票不得以小于 1 美分的单位报价。", "year": 2005, "years": [2005], "by": "SEC，2005", "kind": "原理", "ask": "同一证券在多个场所交易，价格可能各不相同，投资者无法确定自己得到的是否是全市场最好价格"}, {"name": "订单路由与执行质量披露", "text": "经纪商须定期公开客户订单的路由去向与所收付的费用；市场中心与规模较大的经纪商须每月公开按统一口径计算的执行质量统计。", "year": 2000, "years": [2000, 2018, 2024], "by": "SEC，2000（原规则 11Ac1-5、11Ac1-6）；2018、2024 年修订", "kind": "原理", "ask": "订单流付费让经纪商的路由选择与客户的价格利益冲突，冲突本身难以禁止"}]}, {"f": "s07", "no": 7, "title": "价格被人扭曲", "cards": [{"name": "禁止市场操纵", "text": "不得以一系列交易制造实际或表面上的活跃交易，或抬高、压低证券价格，以诱使他人买卖；不得进行虚假成交与事先约定的对敲交易。", "year": 1934, "years": [1934], "by": "美国国会，1934；针对二十年代的资金池操纵", "kind": "原理", "ask": "价格本应反映真实的买卖意愿与公开信息，制造的交易让投资者对供求和信息作出错误推断"}, {"name": "内幕交易", "text": "对信息来源负有信任或保密义务的人，在掌握重大未公开信息时不得交易，或者必须先公开；违反义务泄露信息以获取个人利益的人，与明知而据此交易的人，同样承担责任。", "year": 1961, "years": [1961, 1980, 2016], "by": "SEC，1961；联邦最高法院，1980–2016", "kind": "原理", "ask": "交易者凭对方无法得到的信息交易，对方无从防范，市场的公平性受损"}, {"name": "卖空规则", "text": "经纪商接受卖空订单前须有合理理由相信股票可以借到并按时交割；卖空导致交割失败的，须在规定期限内平仓，否则此后卖空须先借券。", "year": 2004, "years": [2004, 2008, 2009], "by": "SEC，2004；2008–2009 年修订", "kind": "原理", "ask": "没有借到股票的卖空可能无法交割，在没有真实股票的情况下压低价格"}]}, {"f": "s08", "no": 8, "title": "借钱买证券", "cards": [{"name": "初始保证金（T 条例）", "text": "经纪自营商为客户购买保证金证券提供的信贷，不得超过美联储规定的比例；现行规定是客户至少自付买入价款的 50%。", "year": 1934, "years": [1934, 1974], "by": "美国国会，1934；美联储据此制定并多次调整，1974 年后未再调整", "kind": "原理", "ask": "借款买入放大亏损，大量账户同时被追缴会把亏损传给整个市场"}, {"name": "维持保证金与追缴", "text": "保证金账户的权益须持续不低于规定比例，多头股票为持仓市值的 25%；低于时经纪商须在 15 个营业日内收取补足资金，否则卖出持仓；开户前须向客户书面披露这些后果。", "year": 2001, "years": [2001], "by": "交易所与 NASD 的保证金规则，后由 FINRA 统一；披露规则由 SEC 于 2001 年批准", "kind": "原理", "ask": "T 条例只管买入时借多少，不管买入后价格下跌"}, {"name": "日内保证金标准", "text": "保证金账户在交易日内任何时点的权益，都须与当时的市场敞口相当；盘中出现的不足须尽快补足，习惯性不补足的账户须被限制借款与卖空。", "year": 2025, "years": [2025, 2026], "by": "FINRA，2025 年提交；SEC，2026 年批准", "kind": "原理", "ask": "按收盘计算的维持要求管不到日内交易；按交易次数设门槛，既限制了小额交易，又放过了大额敞口"}]}, {"f": "s09", "no": 9, "title": "替人管钱的人", "cards": [{"name": "投资顾问的定义与经纪商排除", "text": "为报酬向他人提供证券意见并以此为业的人是投资顾问；经纪自营商的意见仅附带于经纪业务、且不收取特别报酬时，不属于投资顾问。", "year": 1940, "years": [1940], "by": "美国国会，1940", "kind": "原理", "ask": "收钱提供意见的人另有利益，客户看不到"}, {"name": "投资顾问的受托义务", "text": "投资顾问对客户负有受托义务：须以客户的最大利益行事，不得把自己的利益置于客户之上，并须消除或充分披露可能影响意见的利益冲突。", "year": 1940, "years": [1940, 1963, 2019], "by": "美国国会，1940；联邦最高法院，1963；SEC，2019", "kind": "原理", "ask": "给意见的人另有利益，单纯禁止说假话管不到隐瞒冲突"}, {"name": "客户资产托管", "text": "对客户资产有托管权的投资顾问，须把资产放在合格托管人处，由托管人直接向客户寄送对账单，并每年接受独立会计师的突击检查。", "year": 2003, "years": [2003, 2009], "by": "SEC；2003 年与 2009 年两次大幅修订", "kind": "原理", "ask": "顾问能动用客户资产，客户无从核实资产是否还在"}]}, {"f": "s10", "no": 10, "title": "开户的人是谁", "cards": [{"name": "客户身份识别计划（CIP）", "text": "经纪自营商须在开户时取得客户的姓名、出生日期、住址与身份号码，以证件或非证件方式在合理时间内核实，并与政府名单比对、保存记录。", "year": 2001, "years": [2001, 2003], "by": "美国国会，2001；财政部与 SEC，2003", "kind": "原理", "ask": "证券账户可以用他人或虚构的身份开立，资金来源被交易记录掩盖"}, {"name": "可疑活动报告", "text": "经纪自营商发现涉及至少 5,000 美元、并有理由怀疑涉及违法资金、规避报告、无合理目的或利用经纪商犯罪的交易，须在 30 天内向 FinCEN 报告，且不得告知当事人。", "year": 2001, "years": [2001, 2002], "by": "美国国会，2001；财政部金融犯罪执法网络（FinCEN），2002", "kind": "原理", "ask": "现金交易报告只管现金，证券业的资金大多以转账进出"}, {"name": "制裁的严格责任", "text": "受美国管辖的人不得与 OFAC 制裁名单上的人及其持股合计达 50% 以上的实体交易，也不得向受全面禁运地区的人提供服务；违反时的民事责任不以知情为前提。", "year": 1917, "years": [1917, 1950, 1977], "by": "美国国会与总统，依据 1917 年《对敌贸易法》与 1977 年《国际紧急经济权力法》等授权，制裁项目随外交政策变化；OFAC 于 1950 年设立，负责执行", "kind": "原理", "ask": "开户资料可以不实，受制裁的人可以通过他人或第三地进入市场"}]}, {"f": "s11", "no": 11, "title": "能说什么、不能说什么", "cards": [{"name": "对公众沟通的分类与内容标准", "text": "经纪商的书面沟通按受众分为机构沟通、零售沟通与往来函件，受众越广，事前审查与报备的义务越重；三类沟通都须公平且平衡，不得遗漏使其产生误导的重大事实，不得含有虚假、夸大或承诺性的陈述。", "year": 2012, "years": [2012, 2013], "by": "NASD 与 FINRA；现行结构由监管通知 12-29（2012 年 6 月）公布，2013 年 2 月 4 日生效", "kind": "原理", "ask": "只说一半的推销不必撒谎也能误导客户，事后的反欺诈诉讼成本太高"}, {"name": "采纳与牵连", "text": "第三方的内容一般不是公司的沟通；公司认可、转发了它（采纳），或参与编写了它（牵连），它就成为公司的沟通，适用全部沟通规则。", "year": 2010, "years": [2010, 2017], "by": "FINRA，2010–2017", "kind": "原理", "ask": "公司可以请别人替自己说话，绕开沟通规则；又不能要求公司为所有提到它的话负责"}, {"name": "技术中立：谁发出去，谁负责", "text": "公司对以自己名义发出的沟通负责，无论由人写成还是由 AI 生成；对 AI 能力的陈述本身，也要真实、有据。", "year": 2024, "years": [2024], "by": "FINRA，2024；SEC，2024", "kind": "原理", "ask": "AI 生成的内容数量大、因人而异，公司可能以「不是人写的」为由回避责任；AI 本身也成了卖点，容易被夸大"}]}, {"f": "s12", "no": 12, "title": "重跑：当推荐来自 AI", "cards": [{"name": "最佳利益规则（Reg BI）", "text": "经纪自营商向零售客户推荐证券交易或投资策略时，须以客户的最佳利益行事，不得把自身利益置于客户利益之前；推荐由 AI 作出，同样适用。", "year": 2019, "years": [2019], "by": "SEC，2019", "kind": "重跑", "ask": "经纪商的推荐带有自身利益"}, {"name": "投资顾问的受托义务", "text": "投资顾问对客户负有注意义务与忠实义务，须提供符合客户最佳利益的建议，并充分、公平地披露利益冲突；自动化顾问同样适用。", "year": 1940, "years": [1940, 1963, 2019], "by": "美国国会，1940；联邦最高法院，1963；SEC，2019", "kind": "重跑", "ask": "替人管钱、给人建议的人有自己的利益"}, {"name": "客户身份识别计划（CIP）", "text": "经纪商开户时须按风险采取合理可行的程序核实客户身份，并核对政府提供的恐怖分子名单。", "year": 2001, "years": [2001, 2003], "by": "美国国会，2001；SEC 与财政部，2003", "kind": "重跑", "ask": "不知道开户的人是谁，账户就可能被用于洗钱与诈骗"}, {"name": "对公众沟通的分类与内容标准", "text": "经纪商的书面沟通按受众分为机构沟通、零售沟通与往来函件，受众越广，事前审查与报备的义务越重；三类沟通都须公平且平衡。", "year": 2013, "years": [2013], "by": "NASD 与 FINRA，2013", "kind": "重跑", "ask": "只说一半的推销不必撒谎也能误导客户"}]}],Y0=1905,Y1=2030,x=y=>((y-Y0)/(Y1-Y0)*100).toFixed(2)+'%';
  const g=document.getElementById('rmp'),d=document.getElementById('rmp-d');
  let h='';const all=[];
  R.forEach(r=>{h+=`<div class="rmp-row"><a data-f="${r.f}"><span>${r.no}</span>${r.title}</a><div class="rmp-track">`;
    r.cards.forEach((c,i)=>{all.push([r,c]);h+=`<button type="button" class="rmp-dot${c.kind==='重跑'?' rr':''}" style="left:${x(c.year)}" data-k="${all.length-1}" title="${c.name}（${c.year}）"></button>`;});
    h+='</div></div>';});
  h+='<div class="rmp-ax"><div></div><div>'+[1910,1930,1950,1970,1990,2010,2026].map(y=>`<span style="left:${x(y)}">${y}</span>`).join('')+'</div></div>';
  g.innerHTML=h;g.querySelectorAll('a[data-f]').forEach(a=>a.setAttribute('href',a.dataset.f+'.'+'html'));const bs=[...g.querySelectorAll('.rmp-dot')];
  function set(k){bs.forEach(b=>b.classList.toggle('on',+b.dataset.k===k));const [r,c]=all[k];
    d.innerHTML=`<b>${c.name}</b>${c.text}<br><em>第 ${r.no} 章 · 回应：${c.ask} · 出台：${c.by}</em>`;}
  bs.forEach(b=>b.addEventListener('click',()=>set(+b.dataset.k)));if(all.length)set(0);
})();
</script>
