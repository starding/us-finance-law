<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">拉高出货的五个步骤</p><p class="figsub">一只小盘股在一名有大量关注者的账号推荐前后的价格与持仓。点选步骤，看每一步发生了什么、交易监控能看到什么。示意，数字为假设。</p></div></div>
    <div class="u7-steps" id="u7-steps"></div>
    <svg class="u7-svg" viewBox="0 0 600 180" role="img" aria-label="价格走势示意">
      <line x1="40" y1="160" x2="590" y2="160" class="u7-ax"/><line x1="40" y1="134.1" x2="590" y2="134.1" class="u7-gr"/><line x1="40" y1="30.4" x2="590" y2="30.4" class="u7-gr"/><text x="34" y="138.1" class="u7-t" text-anchor="end">2</text><text x="34" y="34.4" class="u7-t" text-anchor="end">4</text><text x="34" y="14" class="u7-t" text-anchor="end">美元</text><polyline id="u7-ghost" class="u7-gh" points=""/>
      <polyline id="u7-line" class="u7-ln" points=""/>
      <g id="u7-dots"></g>
      <text x="40" y="176" class="u7-t">第 1 天</text><text x="590" y="176" class="u7-t" text-anchor="end">第 10 天</text>
    </svg>
    <div class="u7-hold"><span>账号持仓</span><div class="u7-tr"><i id="u7-h"></i></div><b id="u7-hv"></b></div>
    <div class="u7-d"><p class="u7-dh" id="u7-dh"></p><p id="u7-dx"></p><p class="u7-mon" id="u7-mon"></p></div>
  </div>
</figure>
<style>
.u7-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.u7-steps button{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid transparent;background:var(--quote);color:var(--ink);border-radius:9px;padding:8px 6px}
.u7-steps button.on{border-color:var(--accent)}
.u7-svg{width:100%;height:auto;display:block}
.u7-ax{stroke:var(--line);stroke-width:1}
.u7-ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.u7-gr{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.u7-gh{fill:none;stroke:var(--line);stroke-width:1.5}.u7-t{font-size:11px;fill:var(--muted)}
.u7-dot{fill:var(--card);stroke:var(--accent);stroke-width:2}
.u7-hold{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;font-size:12.5px;margin:6px 0 12px}
.u7-tr{height:12px;background:var(--quote);border-radius:6px;overflow:hidden}
.u7-tr i{display:block;height:100%;background:var(--accent);transition:width .35s}
.u7-hold b{text-align:right}
.u7-d{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6}
.u7-d p{margin:0}.u7-dh{font-weight:600;margin-bottom:4px!important}
.u7-mon{margin-top:6px!important;color:var(--muted)}
@media (max-width:640px){.u7-steps{grid-template-columns:repeat(3,1fr)}}
</style>
<script>
(function(){
  const P=[2.0,2.0,2.1,2.1,2.6,3.4,3.9,3.6,2.4,2.0],X=i=>40+i*(550/9),Y=p=>160-(p-1.5)/2.7*140;
  const S=[['建仓',3,0,'账号在几天里分批买入，价格基本不动。','同一账号或关联账户在低成交量时持续买入。'],
    ['推荐',5,100,'账号发帖推荐，给出目标价，或表示自己在买入、持有、加仓。','发帖时间与发帖人自己的持仓。'],
    ['跟进',6,100,'关注者涌入买入，成交量放大，价格上涨。','同一时段大量新开户或小额账户集中买入同一只股票。'],
    ['出货',7,0,'账号在高位卖出全部持仓，没有告诉关注者。','推荐后短时间内的反向交易，这是 SEC 2022 年 12 月起诉中描述的模式。'],
    ['回落',9,0,'买盘消失，价格回到原处，跟进买入的人承担损失。','事后可以把发帖、交易与价格放在同一条时间线上还原。']];
  const steps=document.getElementById('u7-steps');steps.innerHTML=S.map((s,i)=>`<button type="button">${i+1} ${s[0]}</button>`).join('');
  const bs=[...steps.children];document.getElementById('u7-ghost').setAttribute('points',P.map((p,j)=>X(j)+','+Y(p)).join(' '));const line=document.getElementById('u7-line'),dots=document.getElementById('u7-dots');
  function set(i){bs.forEach((b,j)=>b.classList.toggle('on',i===j));const end=S[i][1];
    line.setAttribute('points',P.slice(0,end+1).map((p,j)=>X(j)+','+Y(p)).join(' '));
    dots.innerHTML=`<circle class="u7-dot" cx="${X(end)}" cy="${Y(P[end])}" r="5"/>`;
    const h=i===0?60:S[i][2];document.getElementById('u7-h').style.width=h+'%';document.getElementById('u7-hv').textContent=h?h+'%':'已清仓';
    document.getElementById('u7-dh').textContent=(i+1)+'. '+S[i][0];document.getElementById('u7-dx').textContent=S[i][3];document.getElementById('u7-mon').textContent='监控能看到：'+S[i][4];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));set(0);
})();
</script>
