<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">短线交易：只看时间，不问知情</p><p class="figsub">一名高管以每股 20 美元买入 1 万股本公司股票，之后以每股 25 美元卖出。拖动两次交易之间相隔的天数。示意。</p></div></div>
    <div class="h7-ctl"><label>买入后第 <b id="h7-dv"></b> 天卖出<input type="range" id="h7-d" min="10" max="300" step="5" value="120"></label></div>
    <div class="h7-tl"><div class="h7-zone"></div><i class="h7-buy"></i><i class="h7-sell" id="h7-s"></i><span class="h7-l0">买入</span><span class="h7-l6">约六个月</span></div>
    <p class="h7-m" id="h7-m" aria-live="polite"></p>
  </div>
</figure>
<style>
.h7-ctl{font-size:13.5px;margin-bottom:16px}.h7-ctl input{width:100%;accent-color:var(--accent)}
.h7-tl{position:relative;height:56px;background:var(--quote);border-radius:8px}
.h7-zone{position:absolute;left:0;top:0;bottom:0;width:60.7%;background:var(--accent-soft);border-radius:8px 0 0 8px;border-right:2px dashed var(--accent)}
.h7-tl i{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;margin-left:-6px}
.h7-buy{left:0;background:var(--ink);margin-left:0!important}
.h7-sell{background:var(--accent);transition:left .3s}
.h7-tl span{position:absolute;bottom:4px;font-size:11.5px;color:var(--muted)}
.h7-l0{left:6px}.h7-l6{left:calc(60.7% + 8px)}
.h7-m{font-size:14px;margin:12px 0 0;min-height:2.6em}
</style>
<script>
(function(){
  const D=document.getElementById('h7-d'),s=document.getElementById('h7-s'),m=document.getElementById('h7-m');
  function run(){const d=+D.value;document.getElementById('h7-dv').textContent=d;s.style.left=(d/300*100)+'%';
    const p=(25-20)*10000;
    m.textContent=d<182?`两次交易相隔不足六个月，利润 ${p.toLocaleString()} 美元归公司所有。即使他卖出时并不掌握任何内幕信息，结果也一样（第 16(b) 条）。`
      :d<=185?'接近六个月的边界：条文写的是「不足六个月」的期间，具体按日历计算，示意图不作精确判断。'
      :'相隔超过六个月，第 16(b) 条不适用；但如果他卖出时掌握重大未公开信息，仍可能违反规则 10b-5。';}
  D.addEventListener('input',run);run();
})();
</script>
