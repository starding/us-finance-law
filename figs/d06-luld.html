<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">涨跌停价格带：价格走到哪里会被拦住</p><p class="figsub">选择档位、参考价与时段，拖动价格，看订单能否成交、何时暂停。参考价为示意；带宽按 LULD 计划，夜盘按 2026 年 8 月 5 日批准的修订。</p></div></div>
    <div class="l6-ctl">
      <div class="l6-seg" id="l6-t"><button type="button" class="on">第一档</button><button type="button">第二档</button></div>
      <div class="l6-seg" id="l6-p"><button type="button">0.50 美元</button><button type="button">2 美元</button><button type="button" class="on">10 美元</button><button type="button">150 美元</button></div>
      <div class="l6-seg" id="l6-s"><button type="button" class="on">常规时段</button><button type="button">夜盘</button></div>
    </div>
    <div class="l6-band" id="l6-band">
      <div class="l6-zone" id="l6-z"></div>
      <span class="l6-ref" id="l6-ref"></span>
      <span class="l6-px" id="l6-px"></span>
    </div>
    <div class="l6-ax" id="l6-ax"></div>
    <input class="l6-rg" id="l6-rg" type="range" min="-40" max="40" step="1" value="0" aria-label="价格相对参考价的变动">
    <p class="l6-m" id="l6-m" aria-live="polite"></p>
  </div>
</figure>
<style>
.l6-ctl{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:14px}
.l6-seg{display:flex}
.l6-seg button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 11px;cursor:pointer;margin-left:-1px}
.l6-seg button:first-child{border-radius:999px 0 0 999px;margin-left:0}.l6-seg button:last-child{border-radius:0 999px 999px 0}
.l6-seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.l6-band{position:relative;height:46px;background:var(--quote);border-radius:8px;overflow:hidden}
.l6-zone{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:2px solid var(--accent);border-right:2px solid var(--accent);transition:left .3s,width .3s}
.l6-ref{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);left:50%}
.l6-px{position:absolute;top:8px;width:14px;height:30px;margin-left:-7px;border-radius:4px;background:var(--ink);transition:left .15s}
.l6-px.out{background:var(--accent)}
.l6-ax{position:relative;height:20px;font-size:11.5px;color:var(--faint)}
.l6-ax i{position:absolute;transform:translateX(-50%);font-style:normal;white-space:nowrap}
.l6-rg{width:100%;accent-color:var(--accent);margin:4px 0 0}
.l6-m{font-size:14px;margin:10px 0 0;min-height:3.2em;line-height:1.6}
</style>
<script>
(function(){
  const P=[0.5,2,10,150];let t=0,p=2,s=0;
  const z=document.getElementById('l6-z'),px=document.getElementById('l6-px'),ax=document.getElementById('l6-ax'),rg=document.getElementById('l6-rg'),m=document.getElementById('l6-m');
  const seg=id=>[...document.getElementById(id).children];
  function pct(){const r=P[p];if(s===1)return 0.20;if(r>3)return t===0?0.05:0.10;if(r>=0.75)return 0.20;return Math.min(0.15/r,0.75);}
  const X=v=>(50+v*50/40);
  function draw(){const r=P[p],w=pct()*100,v=+rg.value,price=r*(1+v/100);
    z.style.left=X(-w)+'%';z.style.width=(X(w)-X(-w))+'%';px.style.left=X(v)+'%';
    const out=Math.abs(v)>w+1e-9;px.classList.toggle('out',out);
    ax.innerHTML=[-40,-20,0,20,40].map(k=>'<i style="left:'+X(k)+'%">'+(k===0?'参考价 '+r+' 美元':(k>0?'+':'')+k+'%')+'</i>').join('');
    const lo=(r*(1-pct())).toFixed(r<1?3:2),hi=(r*(1+pct())).toFixed(r<1?3:2),bw=(pct()*100).toFixed(pct()<0.75&&r<0.75?1:0);
    let msg='价格带 '+lo+'–'+hi+' 美元（±'+bw+'%）。当前价格 '+price.toFixed(r<1?3:2)+' 美元：';
    if(!out)msg+='在带内，可以正常成交。';
    else if(s===0)msg+='超出价格带，带外的成交被禁止；若 15 秒内仍无法回到带内，交易暂停 5 分钟，随后以集合竞价重新开盘。';
    else msg+='超出夜盘静态价格带，交易场所须防止带外成交与报价；夜盘不设自动暂停，交易所可以宣布监管性停牌，停牌的股票当晚不再恢复。';
    if(s===0&&r>3&&pct()<0.2)msg+=(t===0?' 收盘前最后 25 分钟（15:35–16:00），第一档带宽加倍。':'');
    m.textContent=msg;}
  [['l6-t',i=>t=i],['l6-p',i=>p=i],['l6-s',i=>s=i]].forEach(([id,f])=>{const bs=seg(id);bs.forEach((b,i)=>b.addEventListener('click',()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');f(i);draw();}));});
  rg.addEventListener('input',draw);draw();
})();
</script>
